services:
  php:
    build: .
    ports:
      - "8080:80"
    environment:
      # Production par défaut, et c'est le point important : ce fichier est aussi celui du
      # serveur de l'atelier, qui démarre sans rien de plus. Le développement s'active en
      # posant APP_ENV=dev dans un fichier .env à côté de celui-ci — .gitignore l'écarte,
      # il ne peut donc pas partir en production par mégarde.
      #
      # Ce que cela ouvre en développement : un chargé de production peut prendre la place
      # de n'importe quel compte sans son mot de passe, pour essayer les quatre profils
      # sans se déconnecter. Rien de tout cela n'existe en production.
      APP_ENV: ${APP_ENV:-prod}
      # Le journal laisse de côté ce qui ne dit rien : les fichiers statiques, le flux
      # d'événements qui rend la main toutes les minutes, Apache qui se parle à lui-même.
      # JOURNAL_COMPLET=1 rend tout, le temps de comprendre quelque chose de précis.
      JOURNAL_COMPLET: ${JOURNAL_COMPLET:-}
    volumes:
      - ./src:/var/www/html
      # Les essais, en lecture seule et hors de la racine web : personne ne les sert, mais
      # php les lit comme des fichiers. Envoyés par l'entrée standard, leur code de sortie
      # se perdait en route — un essai rouge rendait quand même « tout va bien ».
      - ./tests:/tests:ro
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: myapp
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

  # La documentation (VitePress), en mode développement : http://localhost:8082. Elle se
  # recharge à chaque fichier enregistré dans docs/. Rien à installer sur le poste : npm
  # tourne ici, et node_modules vit dans un volume à lui — les binaires compilés pour Linux
  # n'ont rien à faire dans la copie de travail Windows.
  #
  # Profil « docs » : elle ne démarre pas sur le serveur de l'atelier, qui n'a pas de .env.
  # Un serveur de développement n'a rien à faire en production. Sur un poste de développement,
  # COMPOSE_PROFILES=docs dans le .env la lance avec le reste ; « run docs » la lance seule.
  docs:
    profiles: ["docs"]
    image: node:22-alpine
    working_dir: /docs
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    ports:
      - "8082:8082"
    volumes:
      - ./docs:/docs
      - docs_node_modules:/docs/node_modules

volumes:
  mysql_data:
  docs_node_modules:
