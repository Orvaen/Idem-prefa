# Le journal des requêtes, tel qu'il sort dans « docker compose logs php ».
#
# Le format d'origine — « combined », celui de Debian — donnait par requête l'adresse IP,
# la date complète, la ligne de requête, le référent et le navigateur au long : plus de
# deux cents caractères, dont les cent derniers répètent « Mozilla/5.0 (Windows NT 10.0 »
# à chaque ligne. On garde l'heure, le code, la méthode, l'adresse, le compte et la durée.
#
# Les deux premières colonnes sont des marques, pour que l'œil trouve les ennuis sans lire :
#
#   (rien)  la requête a abouti
#   !!      elle a échoué — code 400 ou plus, ou une erreur de PHP
#   **      un fait de l'application — connexion, demande validée — ou un mot d'Apache
#
# %{end:…}t et non %{…}t : l'heure de la fin de la requête. Le flux d'événements tient une
# minute ; horodaté à son ouverture, il ressortait une minute plus tard au milieu de
# requêtes plus récentes, et le journal se lisait dans le désordre.
#
# %{qui}n est une note posée par PHP, dans Session::identifiant() : le compte connecté.

ServerName localhost

LogFormat "   %{end:%H:%M:%S}t %>s %m %U%q  %{qui}n %{ms}Tms" prefa
LogFormat "!! %{end:%H:%M:%S}t %>s %m %U%q  %{qui}n %{ms}Tms  << %{Referer}i  %a" prefa_echec

# Les messages — ceux d'Apache, et ceux de PHP qui ne passent pas par Journal (erreurs de
# syntaxe, erreurs fatales). %{REQUEST_URI}e dit sur quelle adresse c'est arrivé.
ErrorLogFormat "** %{%H:%M:%S}t %-m %{REQUEST_URI}e %M"

# Ce qu'on ne note pas tant que ça va bien. Rien de tout cela n'apprend quoi que ce soit, et
# ça noie le reste : une page du tableau de bord tire une vingtaine de fichiers statiques,
# le flux rend la main toutes les minutes pour chaque onglet ouvert dans l'atelier, et
# Apache se parle à lui-même pour réveiller ses processus.
#
# Un échec reste noté, lui, quelle que soit l'adresse : un 404 sur une feuille de style est
# précisément ce qu'on cherche quand une page s'affiche de travers.
SetEnvIf User-Agent "internal dummy connection" bruit
SetEnvIf Request_URI "\.(css|js|map|ico|png|jpe?g|svg|webp|woff2?)$" bruit
SetEnvIf Request_URI "^/api/flux\.php$" bruit

# JOURNAL_COMPLET=1 dans l'environnement du conteneur rend tout, y compris le bruit — le
# temps de comprendre pourquoi le flux se reconnecte en boucle, par exemple.
CustomLog ${APACHE_LOG_DIR}/access.log prefa "expr=%{REQUEST_STATUS} < 400 && (! -T reqenv('bruit') || -T osenv('JOURNAL_COMPLET'))"
CustomLog ${APACHE_LOG_DIR}/access.log prefa_echec "expr=%{REQUEST_STATUS} >= 400"
